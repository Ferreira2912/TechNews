<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>S6a · Já tem alguém em mente?</title>
    <script src="shared/gsap.min.js"></script>
    <script src="data/segments.js"></script>
    <link rel="stylesheet" href="shared/brand.css" />
    <style>
      /* Layout dividido (B): conteúdo entre y 40 e 900; o ambiente some de 900 a 1060.
         A cabeça entra por cima à esquerda do centro (x≈90–720, a partir de y≈560): tudo que se lê fica em y 110–490. */
      #ambiente {
        position: absolute;
        inset: 0;
        -webkit-mask-image: linear-gradient(180deg, #000 0px, #000 900px, transparent 1060px);
        mask-image: linear-gradient(180deg, #000 0px, #000 900px, transparent 1060px);
      }
      /* trecho curto: a câmera fica parada; o único movimento contínuo é o Ken Burns dentro do cartão */
      #cam {
        position: absolute;
        inset: 0;
        transform-origin: 540px 465px;
      }
      /* elemento principal: cartão de foto (peça 3, mulher de chapéu no lago), borda inferior em y = 890 */
      #foto {
        left: 40px;
        top: 40px;
        width: 1000px;
        height: 850px;
        border-radius: 30px; /* 3% da largura */
        background: #1d1a1f;
      }
      /* camada do Ken Burns (escala ≤ 1,04), origem no chapéu */
      #foto .kb {
        position: absolute;
        inset: 0;
        transform-origin: 810px 657px;
      }
      /* parte de cima do cartão: a própria foto ampliada e desfocada (névoa como no topo da peça 3) */
      #foto .desfoque {
        position: absolute;
        inset: -60px;
        background: url("assets/fotos/lago_chapeu.png") 100% 40% / cover no-repeat;
        filter: blur(28px) saturate(0.9);
      }
      /* foto nítida perto da escala nativa (1,1x), ancorada na base; a mulher fica à direita da cabeça */
      #foto .nitida-v {
        position: absolute;
        left: 170px;
        bottom: 0;
        width: 1188px;
        height: 369px;
        -webkit-mask-image: linear-gradient(180deg, transparent 0px, rgba(0, 0, 0, 0.45) 26px, #000 54px);
        mask-image: linear-gradient(180deg, transparent 0px, rgba(0, 0, 0, 0.45) 26px, #000 54px);
      }
      #foto .nitida {
        position: absolute;
        inset: 0;
        background: url("assets/fotos/lago_chapeu.png") 0 0 / 100% 100% no-repeat;
        /* a mulher fica nítida; cais e barcos à esquerda se dissolvem na névoa */
        -webkit-mask-image: radial-gradient(640px 400px at 660px 270px, #000 52%, transparent 100%);
        mask-image: radial-gradient(640px 400px at 660px 270px, #000 52%, transparent 100%);
      }
      /* cópia desfocada com a mesma geometria: a borda de cima da foto nítida derrete na névoa.
         A máscara fica num invólucro maior, para não cortar o espalhamento do desfoque. */
      #foto .ponte-m {
        position: absolute;
        left: 70px;
        top: 381px;
        width: 1388px;
        height: 569px;
        -webkit-mask-image: radial-gradient(760px 560px at 780px 430px, #000 40%, transparent 100%);
        mask-image: radial-gradient(760px 560px at 780px 430px, #000 40%, transparent 100%);
      }
      #foto .ponte {
        position: absolute;
        left: 100px;
        top: 100px;
        width: 1188px;
        height: 369px;
        background: url("assets/fotos/lago_chapeu.png") 0 0 / 100% 100% no-repeat;
        filter: blur(30px);
        opacity: 0.9;
      }
      #foto .escurece {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(700px 260px at 470px 330px, rgba(0, 0, 0, 0.42) 0%, rgba(0, 0, 0, 0.2) 55%, rgba(0, 0, 0, 0) 100%),
          rgba(20, 0, 20, 0.12);
      }

      /* título da peça 3, todo em amarelo, duas linhas, y ≈ 285–485 */
      #titulo {
        position: absolute;
        left: 80px;
        top: 290px;
        font-size: 104px;
        white-space: nowrap;
      }
      #titulo .linha {
        display: block;
        height: 0.95em;
      }
      /* máscara de cada linha: corta só embaixo (as palavras sobem de dentro dela) */
      #titulo .mask {
        display: inline-block;
        clip-path: inset(-0.3em -0.1em 0 -0.1em);
      }
      #titulo .pal {
        display: inline-block;
      }
      #olhos {
        display: inline-block;
        margin-left: 0.12em;
        font-size: 0.94em;
        color: var(--roxo-borda); /* o emoji é colorido pela própria fonte; isto só vale se a fonte faltar */
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="S6a" data-start="0" data-width="1080" data-height="1920" data-duration="2.350000" data-fps="60">
      <div class="fundo-roxo"></div>
      <div id="ambiente">
        <div id="cam">
          <div id="foto" class="cartao">
            <div class="kb" data-layout-allow-overflow>
              <div class="desfoque" data-layout-allow-overflow></div>
              <div class="ponte-m" data-layout-allow-overflow><div class="ponte"></div></div>
              <div class="nitida-v" data-layout-allow-overflow><div class="nitida" data-layout-allow-overflow></div></div>
            </div>
            <div class="escurece"></div>
            <div class="grad-leitura"></div>
          </div>
          <!-- entrelinha 0,95 da peça: as caixas das linhas se tocam de propósito; as palavras sobem de dentro da máscara -->
          <div id="titulo" class="titulo am">
            <div class="linha">
              <span class="mask"><span class="pal" data-layout-allow-overlap data-layout-allow-occlusion>JÁ</span> <span class="pal" data-layout-allow-overlap data-layout-allow-occlusion>TEM</span> <span class="pal" data-layout-allow-overlap data-layout-allow-occlusion>ALGUÉM</span></span>
            </div>
            <div class="linha">
              <span class="mask"><span class="pal" data-layout-allow-overlap data-layout-allow-occlusion>EM</span> <span class="pal" data-layout-allow-overlap data-layout-allow-occlusion>MENTE?</span></span><span id="olhos" class="emoji" data-layout-allow-overlap>👀</span>
            </div>
          </div>
        </div>
      </div>

      <!-- elementos fixos da campanha (fora da câmera) -->
      <div id="hud">
        <img class="logo" src="assets/logo_parktur.png" alt="Parktur" />
        <div class="selo">INDIQUE E VIAJE!</div>
      </div>
    </div>
    <script type="application/json" id="sfx-events">
      []
    </script>
    <script>
      (function () {
        const S = window.SEGMENTS.S6a;
        const at = (w) => S.words.find((x) => x.w.startsWith(w)).t;
        const tl = gsap.timeline({ paused: true });
        const D = S.duration;

        // quadro 0: selo, logo e cartão de foto parados e nítidos; o título ainda está dentro da máscara
        gsap.set("#titulo .pal", { yPercent: 130 });
        gsap.set("#olhos", { scale: 0, opacity: 0, transformOrigin: "50% 60%" });

        // "Já": as palavras sobem rápido de dentro da máscara (power3.out), em sequência curta
        tl.to("#titulo .pal", { yPercent: 0, duration: 0.5, ease: "power3.out", stagger: 0.05 }, at("Já"));

        // "alguém": os olhos 👀 surgem com leve ultrapassagem
        tl.to("#olhos", { opacity: 1, duration: 0.12, ease: "power1.out" }, at("alguém"));
        tl.to("#olhos", { scale: 1, duration: 0.4, ease: "back.out(2)" }, at("alguém"));

        // Ken Burns suave da foto (1 → 1,04), começa parado
        tl.to("#foto .kb", { scale: 1.04, duration: D - 0.05, ease: "sine.inOut" }, 0.05);

        window.__timelines["S6a"] = tl;
      })();
    </script>
  </body>
</html>
