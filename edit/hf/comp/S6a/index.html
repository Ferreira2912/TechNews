<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>S6a · Já tem alguém em mente?</title>
    <script src="shared/gsap.min.js"></script>
    <script src="data/segments.js"></script>
    <link rel="stylesheet" href="shared/brand.css" />
    <style>
      /* Camada transparente (layout A): o compositor aplica estes PNGs RGBA sobre a câmera intacta.
         Zona livre superior deste trecho: y 110–400 (topo do cabelo em 431), x 60–920.
         Sem imagem nenhuma: só o título da peça 3 em texto puro, em amarelo. */
      html,
      body {
        background: transparent;
      }
      /* degradê de leitura só no topo: preto 0,55 em y = 0 até transparente em y = 470 (o rosto começa em 560);
         mais denso atrás do título e quase nulo (< 3 %) a partir de y ≈ 420, acima do topo do cabelo (431) */
      #grad {
        position: absolute;
        left: 0;
        top: 0;
        width: 1080px;
        height: 470px;
        background: linear-gradient(
          180deg,
          rgba(0, 0, 0, 0.55) 0%,
          rgba(0, 0, 0, 0.52) 25%,
          rgba(0, 0, 0, 0.42) 50%,
          rgba(0, 0, 0, 0.26) 70%,
          rgba(0, 0, 0, 0.1) 82%,
          rgba(0, 0, 0, 0.025) 90%,
          rgba(0, 0, 0, 0) 100%
        );
        pointer-events: none;
      }

      /* título da peça 3, todo em amarelo, duas linhas alinhadas à esquerda em x = 73 */
      #titulo {
        position: absolute;
        left: 73px;
        top: 170px;
        font-size: 104px;
        white-space: nowrap;
        transform-origin: 0% 50%;
        text-shadow:
          0 3px 18px rgba(0, 0, 0, 0.48),
          0 2px 5px rgba(0, 0, 0, 0.4);
      }
      #titulo .linha {
        display: block;
        height: 0.95em;
      }
      /* máscara de cada linha: corta só embaixo (as palavras sobem de dentro dela) */
      #titulo .mask {
        display: inline-block;
        clip-path: inset(-0.35em -0.2em 0 -0.2em);
      }
      #titulo .pal {
        display: inline-block;
      }
      #olhos {
        display: inline-block;
        margin-left: 0.16em;
        font-size: 0.86em;
        line-height: 1;
        vertical-align: 0.02em;
        text-shadow: 0 6px 18px rgba(0, 0, 0, 0.3);
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="S6a" data-start="0" data-width="1080" data-height="1920" data-duration="2.350000" data-fps="60">
      <div id="grad"></div>
      <!-- entrelinha 0,95 da peça: as caixas das linhas se tocam de propósito; as palavras sobem de dentro da máscara -->
      <div id="titulo" class="titulo am">
        <div class="linha">
          <span class="mask"><span class="pal" data-layout-allow-overlap data-layout-allow-occlusion>JÁ</span> <span class="pal" data-layout-allow-overlap data-layout-allow-occlusion>TEM</span> <span class="pal" data-layout-allow-overlap data-layout-allow-occlusion>ALGUÉM</span></span>
        </div>
        <div class="linha">
          <span class="mask"><span class="pal" data-layout-allow-overlap data-layout-allow-occlusion>EM</span> <span class="pal" data-layout-allow-overlap data-layout-allow-occlusion>MENTE?</span></span><span id="olhos" class="emoji" data-layout-allow-overlap>👀</span>
        </div>
      </div>
    </div>
    <script>
      (function () {
        const S = window.SEGMENTS.S6a;
        const at = (w) => S.words.find((x) => x.w.startsWith(w)).t;
        const tl = gsap.timeline({ paused: true });
        const D = S.duration;

        const tJa = at("Já"); // ≈ 0,04
        const tOlhos = at("alguém"); // ≈ 0,85
        const tQuer = at("querendo"); // ≈ 1,39

        // quadro 0: só o degradê; as palavras estão dentro da máscara e os olhos ainda não existem
        gsap.set("#titulo .pal", { yPercent: 130 });
        gsap.set("#olhos", { scale: 0, opacity: 0, rotation: 0, transformOrigin: "50% 60%" });
        gsap.set("#titulo", { x: 0, y: 0, scale: 1 });
        gsap.set("#grad", { opacity: 1 });

        // "Já": cada palavra sobe da máscara da sua linha (power3.out 0,5 s, 0,05 s entre palavras)
        tl.to("#titulo .pal", { yPercent: 0, duration: 0.5, ease: "power3.out", stagger: 0.05 }, tJa);

        // "alguém": os olhos 👀 surgem com ultrapassagem
        tl.to("#olhos", { opacity: 1, duration: 0.12, ease: "power1.out" }, tOlhos);
        tl.to("#olhos", { scale: 1, duration: 0.42, ease: "back.out(2)" }, tOlhos);

        // "querendo": os olhos dão uma olhadinha de lado (inclinação leve, ida e volta)
        tl.to("#olhos", { rotation: -9, duration: 0.3, ease: "sine.inOut" }, tQuer);
        tl.to("#olhos", { rotation: 0, duration: 0.4, ease: "sine.inOut" }, tQuer + 0.3);

        // depois da entrada: deriva suave do bloco (≤ 2 %), para nada ficar parado
        tl.to("#titulo", { y: -6, scale: 1.015, duration: D - 0.6 - 0.02, ease: "sine.inOut" }, 0.6);

        // saída: o S6b continua o mesmo plano sem gráfico, então o título não pode sumir num corte seco.
        // Nos últimos ~0,27 s as palavras descem de volta para a máscara, os olhos encolhem e o degradê
        // se desfaz; no último quadro (D − 1/60) não sobra nada além de pixels totalmente transparentes.
        const tSai = D - 0.27; // ≈ 2,08 (texto inteiro legível de ~0,74 a ~2,08)
        tl.to("#olhos", { scale: 0.5, opacity: 0, duration: 0.18, ease: "power2.in" }, tSai);
        tl.to(
          "#titulo .pal",
          { yPercent: 130, duration: 0.2, ease: "power2.in", stagger: { each: 0.012, from: "end" } },
          tSai,
        );
        tl.to("#grad", { opacity: 0, duration: 0.25, ease: "sine.inOut" }, tSai);

        window.__timelines["S6a"] = tl;
      })();
    </script>
  </body>
</html>
