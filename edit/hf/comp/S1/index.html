<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>S1 · Gancho: e se seus amigos ajudassem</title>
    <script src="shared/gsap.min.js"></script>
    <script src="data/segments.js"></script>
    <link rel="stylesheet" href="shared/brand.css" />
    <style>
      /* Layout dividido (B): conteúdo entre y 40 e 900; o ambiente some de 900 a 1060. */
      #ambiente {
        position: absolute;
        inset: 0;
        -webkit-mask-image: linear-gradient(180deg, #000 0px, #000 900px, transparent 1060px);
        mask-image: linear-gradient(180deg, #000 0px, #000 900px, transparent 1060px);
      }
      /* fundo: cópia ampliada e desfocada da peça 1 + véu roxo (mesmo tratamento da moldura de prova) */
      #fundo {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }
      /* recorte sem texto da própria peça 1 (costa de Amalfi), ampliado: céu e mar dominam e o título da peça
         não vira "texto fantasma" atrás do cartão; mesmo filtro e véu da moldura de prova */
      #fundo .prova-fundo {
        background-image: url("assets/fotos/costa_amalfi.png");
        background-size: cover;
        background-position: 50% 20%;
      }
      #cam {
        position: absolute;
        inset: 0;
        /* origem no topo do cartão: o Ken Burns cresce para baixo e o topo fica em y = 40 */
        transform-origin: 540px 40px;
      }
      /* elemento principal: mockup da peça 1 (story 9:16), topo y = 40, base y = 880 (897 ao fim do Ken Burns) */
      #story {
        left: 303.75px;
        top: 40px;
        width: 472.5px;
        height: 840px;
        border-radius: 14px; /* 3% da largura */
        background: #2b0029 url("assets/pecas/peca1.png") center / 100% 100% no-repeat;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="S1" data-start="0" data-width="1080" data-height="1920" data-duration="4.5" data-fps="60">
      <div class="fundo-roxo"></div>
      <div id="ambiente">
        <div id="fundo">
          <div id="fundoImg" class="prova-fundo" data-layout-allow-overflow></div>
          <div class="prova-veu"></div>
        </div>
        <div id="cam">
          <div id="story" class="cartao"></div>
        </div>
      </div>
    </div>
    <script type="application/json" id="sfx-events">
      [{ "t": 0.7, "type": "impacto", "nota": "cartão da peça 1 (E se seus amigos ajudassem...) assenta no lugar" }]
    </script>
    <script>
      (function () {
        const S = window.SEGMENTS.S1;
        const at = (w) => S.words.find((x) => x.w.startsWith(w)).t;
        const tl = gsap.timeline({ paused: true });
        const D = S.duration;

        // quadro 0 (também é a capa): só o fundo; o cartão está abaixo de y = 1140, dentro da máscara (invisível)
        gsap.set("#story", { y: 1100, scale: 0.94, transformOrigin: "50% 0%" });
        gsap.set("#fundoImg", { scale: 1.0, transformOrigin: "50% 30%" });

        // "E se eu te...": o cartão sobe com power3.out, passa 8 px do lugar e assenta (impacto ~0,70 s)
        const t0 = Math.max(0.05, at("E") + 0.02);
        tl.to("#story", { y: -8, duration: 0.52, ease: "power3.out" }, t0);
        tl.to("#story", { scale: 1, duration: 0.52, ease: "power3.out" }, t0);
        tl.to("#story", { y: 0, duration: 0.16, ease: "sine.inOut" }, t0 + 0.52);

        // fundo desfocado: deriva lenta (variação 0,04)
        tl.to("#fundoImg", { scale: 1.04, duration: D - t0, ease: "sine.inOut" }, t0);

        // Ken Burns da câmera (tipo 1): 1 → 1,02 até o fim; base do cartão 880 → 897
        const kb = t0 + 0.68;
        tl.to("#cam", { scale: 1.02, duration: D - kb, ease: "sine.inOut" }, kb);

        window.__timelines["S1"] = tl;
      })();
    </script>
  </body>
</html>
