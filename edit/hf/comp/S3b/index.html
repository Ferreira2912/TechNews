    <script type="application/json" id="sfx-events">
      [
        { "t": 2.54, "type": "click", "nota": "botão ENVIAR INDICAÇÃO pressionado (afunda e volta)" },
        { "t": 2.58, "type": "envio", "nota": "avião de papel sai do botão e voa até o contato Colega (chega em 2,98 s; check amarelo + 'Indicação enviada')" },
        { "t": 3.493, "type": "passagem", "nota": "ponto médio da passagem rápida da câmera (3,243 → 3,743 s): cartão INDICAR → cartão Sua viagem" },
        { "t": 4.113, "type": "confirmacao", "nota": "carimbo verde VIAGEM FECHADA assenta no cartão de reserva" }
      ]
    </script>
    <script>
      (function () {
        const S = window.SEGMENTS.S3b;
        const at = (w) => S.words.find((x) => x.w.startsWith(w)).t;
        const tl = gsap.timeline({ paused: true });
        const D = S.duration;
        const OFF = "#3a2e3b"; // cor neutra do nome do contato
        const ON = "#63005e"; // roxo da marca

        // ---------- quadro 0: tudo parado e nítido ----------
        // câmera: escala em torno do centro do cartão (540, 818)
        gsap.set("#cam", { x: 0, scale: 1, transformOrigin: "540px 818px" });
        gsap.set("#fundo", { x: 0 });
        // a janela INDICAR começa em 0,86 e cresce 1,16x em "indica" (origem na base: borda inferior fica em y = 1215)
        gsap.set("#cardA", { scale: 0.86, opacity: 1, filter: "blur(0px)", transformOrigin: "50% 100%" });
        gsap.set("#cardB", { scale: 1, transformOrigin: "50% 50%" });
        gsap.set("#sel", { opacity: 0, scale: 0.94, y: 0, transformOrigin: "50% 50%" });
        gsap.set(".av-on", { opacity: 0 });
        gsap.set(".radio-on", { opacity: 0, scale: 0.5, transformOrigin: "50% 50%" });
        gsap.set("#l3 .chk", { scale: 0, transformOrigin: "50% 50%" });
        gsap.set("#l3 .nota-env", { opacity: 0, y: 12 });
        gsap.set(".nome", { y: 0 });
        gsap.set("#btnEnviar", { scale: 1, transformOrigin: "50% 50%" });
        gsap.set("#ripple", { opacity: 0, scale: 0.2, transformOrigin: "50% 50%" });
        gsap.set("#aviao", { opacity: 0, scale: 0.4, x: 0, y: 0, transformOrigin: "50% 50%" });
        gsap.set("#carimbo", { opacity: 0, scale: 1.55, rotation: -9, transformOrigin: "50% 50%" });

        // ---------- ESTAÇÃO 1 ----------
        // "indica": a janela cresce 0,86 → 1 (×1,16) em 0,55 s, power2.inOut, com a câmera parada
        const tInd = at("indica") - 0.02;
        tl.to("#cardA", { scale: 1, duration: 0.55, ease: "power2.inOut" }, tInd);

        // deriva suave da câmera (≤ 0,04) até a passagem
        const tPass = at("fechar") - 0.25; // passagem rápida: 0,5 s antes de "fechar"
        const tDrift1 = tInd + 0.6;
        tl.to("#cam", { scale: 1.015, duration: tPass - tDrift1, ease: "sine.inOut" }, tDrift1);

        // cada contato acende exatamente na sua palavra (seleção desliza entre as linhas)
        const rowOn = (r, t) => {
          tl.to(r + " .av-on", { opacity: 1, duration: 0.2, ease: "power2.out" }, t - 0.06);
          tl.to(r + " .radio-on", { opacity: 1, scale: 1, duration: 0.28, ease: "back.out(2)" }, t - 0.06);
          tl.to(r + " .nome", { color: ON, duration: 0.2, ease: "power2.out" }, t - 0.06);
        };
        const rowOff = (r, t) => {
          tl.to(r + " .av-on", { opacity: 0, duration: 0.2, ease: "power2.out" }, t - 0.08);
          tl.to(r + " .radio-on", { opacity: 0, scale: 0.5, duration: 0.18, ease: "power2.in" }, t - 0.1);
          tl.to(r + " .nome", { color: OFF, duration: 0.2, ease: "power2.out" }, t - 0.08);
        };
        const tAmigo = at("amigo");
        const tFam = at("familiar");
        const tCol = at("colega");
        tl.to("#sel", { opacity: 1, scale: 1, duration: 0.24, ease: "power2.out" }, tAmigo - 0.1);
        rowOn("#l1", tAmigo);
        tl.to("#sel", { y: 144, duration: 0.3, ease: "power3.inOut" }, tFam - 0.16);
        rowOff("#l1", tFam);
        rowOn("#l2", tFam);
        tl.to("#sel", { y: 288, duration: 0.3, ease: "power3.inOut" }, tCol - 0.16);
        rowOff("#l2", tCol);
        rowOn("#l3", tCol);

        // enviar: o botão é pressionado (click no fundo do toque) ...
        const tP = tCol + 0.2;
        const tClick = tP + 0.09;
        tl.to("#btnEnviar", { scale: 0.93, duration: 0.09, ease: "power2.in" }, tP);
        tl.to("#btnEnviar", { scale: 1, duration: 0.28, ease: "back.out(2.2)" }, tClick);
        tl.to("#ripple", { opacity: 0.55, duration: 0.05, ease: "power1.out" }, tClick);
        tl.to("#ripple", { scale: 2.8, duration: 0.45, ease: "power2.out" }, tClick);
        tl.to("#ripple", { opacity: 0, duration: 0.38, ease: "power2.out" }, tClick + 0.07);

        // ... e a indicação (avião de papel) voa do botão até o contato Colega (envio)
        const tA = tClick + 0.02;
        tl.to("#aviao", { opacity: 1, scale: 1, duration: 0.14, ease: "power2.out" }, tA);
        tl.to("#aviao", { x: 464, duration: 0.38, ease: "power2.out" }, tA + 0.04);
        tl.to("#aviao", { y: -158, duration: 0.38, ease: "power2.in" }, tA + 0.04);
        const tChega = tA + 0.42;
        tl.to("#aviao", { opacity: 0, scale: 0.45, duration: 0.12, ease: "power2.in" }, tChega - 0.08);
        tl.to("#l3 .ponto", { scale: 0, duration: 0.12, ease: "power2.in" }, tChega - 0.06);
        tl.to("#l3 .chk", { scale: 1, duration: 0.3, ease: "back.out(2.4)" }, tChega);
        tl.to("#l3 .nome", { y: -22, duration: 0.28, ease: "power2.out" }, tChega);
        tl.to("#l3 .nota-env", { opacity: 1, y: 0, duration: 0.28, ease: "power2.out" }, tChega + 0.02);

        // ---------- PASSAGEM (único movimento rápido): 0,5 s power3.inOut, começa 0,25 s antes de "fechar" ----------
        tl.to("#cam", { x: -1080, scale: 1, duration: 0.5, ease: "power3.inOut" }, tPass);
        tl.to("#fundo", { x: -220, duration: 0.5, ease: "power3.inOut" }, tPass); // paralaxe do fundo
        tl.to("#cardA", { filter: "blur(12px)", opacity: 0.7, duration: 0.32, ease: "power2.in" }, tPass);

        // ---------- ESTAÇÃO 2 ----------
        // "uma viagem": carimbo verde VIAGEM FECHADA cai com leve ultrapassagem; toca 1,0 em ~31% (back.out 2,2)
        const tC = at("viagem") - 0.14;
        const tToca = tC + 0.45 * 0.3125;
        tl.to("#carimbo", { opacity: 1, duration: 0.1, ease: "power1.out" }, tC);
        tl.to("#carimbo", { scale: 1, rotation: -4, duration: 0.45, ease: "back.out(2.2)" }, tC);
        tl.to("#slot", { opacity: 0, duration: 0.2, ease: "power1.out" }, tToca);
        tl.to("#cardB", { scale: 0.985, duration: 0.07, ease: "power2.out" }, tToca);
        tl.to("#cardB", { scale: 1, duration: 0.3, ease: "power2.out" }, tToca + 0.07);

        // deriva suave até o fim (escala 1 → 1,03 em torno do centro do cartão: x = -1080·s)
        const tFim = tPass + 0.5;
        tl.to("#cam", { scale: 1.03, x: -1080 * 1.03, duration: D - tFim, ease: "sine.inOut" }, tFim);

        window.__timelines["S3b"] = tl;
      })();
    </script>
