<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>S3c · Você ganha R$ 100</title>
    <script src="shared/gsap.min.js"></script>
    <script src="data/segments.js"></script>
    <link rel="stylesheet" href="shared/brand.css" />
    <style>
      /* Camada transparente (layout A): o compositor aplica estes PNGs RGBA sobre a câmera intacta. */
      html,
      body {
        background: transparent;
      }
      /* Zona livre inferior deste trecho: y 1010–1650 (queixo em 957).
         Box de 608 × 356 px centrado no meio do quadro (x = 540, pedido do cliente), y = 1290; no pico
         da janela de demonstração (×1,15) o box sólido fica em x ≈ 190–890 e a sombra não passa de y 1650. */
      #grp {
        position: absolute;
        left: 236px;
        top: 1112px;
        width: 608px;
        height: 356px;
        transform-origin: 50% 50%;
      }
      #box {
        position: absolute;
        inset: 0;
        border: 4px solid var(--amarelo);
        border-radius: 40px;
        background: rgba(99, 0, 94, 0.96);
        box-shadow: var(--sombra);
        box-sizing: border-box;
        transform-origin: 50% 50%;
      }
      /* brilho diagonal recortado pelo box */
      #box .recorte {
        position: absolute;
        inset: 0;
        border-radius: 36px;
        overflow: hidden;
      }
      #brilho {
        position: absolute;
        top: -40px;
        bottom: -40px;
        left: 0;
        width: 160px;
        background: linear-gradient(90deg, rgba(255, 255, 255, 0) 0%, rgba(255, 255, 255, 0.16) 50%, rgba(255, 255, 255, 0) 100%);
        transform: skewX(-18deg);
      }
      #box .etiqueta {
        top: -36px;
      }
      #box .etiqueta > span {
        box-sizing: border-box;
        height: 68px;
        line-height: 62px;
        padding: 0 34px;
        border: 3px solid var(--amarelo);
        font-size: 44px;
      }
      #box .conteudo {
        position: absolute;
        left: 0;
        right: 0;
        top: 56px;
        bottom: 30px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }
      #box .valor {
        position: relative;
        font-size: 214px;
        line-height: 0.86;
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      /* "R$ 0" / "R$ 88" durante a contagem não colam no número (o "1" tabular já abre espaço no 100) */
      #box .valor .rs {
        top: -0.06em;
        margin-right: 0.1em;
      }
      #sublinhado {
        width: 190px;
        height: 8px;
        margin-top: 14px;
        border-radius: 999px;
        background: var(--amarelo);
        transform-origin: 50% 50%;
      }
      #box .linha {
        margin-top: 14px;
        font-weight: 400;
        font-size: 36px;
        line-height: 1.1;
        letter-spacing: -0.01em;
        color: #fff;
        white-space: nowrap;
      }
      /* faíscas presas ao valor (cantos do "100" e do "R$"), sempre dentro do box */
      .faisca {
        position: absolute;
        width: 52px;
        height: 52px;
        margin: -26px 0 0 -26px;
      }
      .faisca svg {
        display: block;
        width: 100%;
        height: 100%;
      }
      #f1 {
        left: calc(100% + 4px);
        top: 22px;
      }
      #f2 {
        left: calc(100% + 18px);
        top: 84px;
        width: 28px;
        height: 28px;
        margin: -14px 0 0 -14px;
      }
      #f3 {
        left: -14px;
        top: 150px;
        width: 34px;
        height: 34px;
        margin: -17px 0 0 -17px;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="S3c" data-start="0" data-width="1080" data-height="1920" data-duration="4.116667" data-fps="60">
      <div id="grp">
        <div id="box">
          <div class="recorte"><div id="brilho"></div></div>
          <div class="etiqueta"><span>VOCÊ GANHA</span></div>
          <div class="conteudo">
            <div class="valor">
              <span class="rs">R$</span><span id="num">0</span>
              <div class="faisca" id="f1"><svg viewBox="0 0 40 40"><path d="M20 0 C21.6 13.2 26.8 18.4 40 20 C26.8 21.6 21.6 26.8 20 40 C18.4 26.8 13.2 21.6 0 20 C13.2 18.4 18.4 13.2 20 0 Z" fill="#FFC300" /></svg></div>
              <div class="faisca" id="f2"><svg viewBox="0 0 40 40"><path d="M20 0 C21.6 13.2 26.8 18.4 40 20 C26.8 21.6 21.6 26.8 20 40 C18.4 26.8 13.2 21.6 0 20 C13.2 18.4 18.4 13.2 20 0 Z" fill="#FFC300" /></svg></div>
              <div class="faisca" id="f3"><svg viewBox="0 0 40 40"><path d="M20 0 C21.6 13.2 26.8 18.4 40 20 C26.8 21.6 21.6 26.8 20 40 C18.4 26.8 13.2 21.6 0 20 C13.2 18.4 18.4 13.2 20 0 Z" fill="#FFC300" /></svg></div>
            </div>
            <div id="sublinhado"></div>
            <div class="linha">em crédito para sua próxima viagem</div>
          </div>
        </div>
      </div>
    </div>
    <script>
      (function () {
        const S = window.SEGMENTS.S3c;
        const at = (w) => S.words.find((x) => x.w.startsWith(w)).t;
        const tl = gsap.timeline({ paused: true });

        const tEntra = at("ganha") - 0.05; // ≈ 0,33
        const tConta = at("R$ 100"); // ≈ 0,83
        const tPousa = tConta + 0.7; // fim do contador (o 100 aparece ≈ 0,05 s antes, com snap)
        const tDemo = at("de") + 0.05; // ≈ 1,60 (atravessa o corte da filmagem em ≈ 2,15)
        const tDemoFim = tDemo + 0.6;
        const tSai = S.duration - 0.24; // saída curta, termina no corte para S4a

        // quadro 0: nada visível
        gsap.set("#grp", { scale: 1, y: 0 });
        gsap.set("#box", { opacity: 0, scale: 0.86, y: 56, filter: "blur(0px)" });
        gsap.set("#sublinhado", { scaleX: 0 });
        gsap.set("#brilho", { x: -260 });
        gsap.set(".faisca", { scale: 0, rotation: -45, opacity: 0 });

        // "ganha": o box entra de baixo com leve ultrapassagem (impacto ao assentar)
        tl.to("#box", { opacity: 1, duration: 0.18, ease: "power1.out" }, tEntra);
        tl.to("#box", { scale: 1, y: 0, duration: 0.45, ease: "back.out(1.6)" }, tEntra);

        // "R$ 100": contador R$ 0 → R$ 100 (inteiros)
        tl.to("#num", { innerText: 100, snap: { innerText: 1 }, duration: 0.7, ease: "power2.out" }, tConta);

        // contador pousa: sublinhado amarelo se desenha do centro + faíscas pequenas
        tl.to("#sublinhado", { scaleX: 1, duration: 0.45, ease: "power3.out" }, tPousa - 0.12);
        tl.to("#f1", { scale: 1, rotation: 0, opacity: 1, duration: 0.32, ease: "back.out(2.2)" }, tPousa - 0.08);
        tl.to("#f2", { scale: 1, rotation: 0, opacity: 1, duration: 0.3, ease: "back.out(2.2)" }, tPousa);
        tl.to("#f3", { scale: 1, rotation: 0, opacity: 1, duration: 0.32, ease: "back.out(2.2)" }, tPousa + 0.06);
        tl.to(".faisca", { scale: 0, rotation: 45, opacity: 0, duration: 0.35, ease: "power2.in", stagger: 0.07 }, tPousa + 0.42);

        // "de crédito": janela de demonstração 1,0 → 1,15 em torno do próprio centro
        tl.to("#grp", { scale: 1.15, duration: 0.6, ease: "power2.inOut" }, tDemo);
        // brilho atravessa o box enquanto a filmagem corta (≈ 2,15)
        tl.to("#brilho", { x: 820, duration: 0.75, ease: "power2.inOut" }, tDemo + 0.3);

        // deriva suave até o fim: só sobe 10 px (a escala fica em 1,15)
        tl.to("#grp", { y: -10, duration: tSai - tDemoFim, ease: "sine.inOut" }, tDemoFim);

        // saída curta no fim do trecho
        tl.to("#box", { opacity: 0, scale: 0.94, y: 12, filter: "blur(8px)", duration: 0.22, ease: "power2.in" }, tSai);

        window.__timelines = window.__timelines || {};
        window.__timelines["S3c"] = tl;
      })();
    </script>
  </body>
</html>
